services:
  - type: web
    name: tqa-backend
    env: python
    region: singapore          # বাংলাদেশের কাছাকাছি
    plan: starter          # পেইড — free নয় (dashboard থেকে আপগ্রেড করা হয়েছে, এখানে সিঙ্ক রাখা হলো)
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py create_director
    # gthread + threads → একসাথে অনেক বেশি রিকোয়েস্ট সামলাতে পারে (আমাদের কাজ বেশিরভাগ
    # সময় CPU নয়, ডেটাবেস-অপেক্ষায় কাটে — থ্রেড এই অপেক্ষার সময় GIL ছেড়ে দেয়, তাই একই
    # ২টা worker প্রসেসেই অনেক বেশি একসাথে ব্যবহারকারী সামলানো যায়, বাড়তি CPU/RAM ছাড়াই)
    startCommand: gunicorn tqa_backend.wsgi --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 120 --capture-output --log-level warning
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false    # Neon dashboard থেকে নিয়ে manually বসান (স্থায়ী)
      - key: CLOUDINARY_URL
        sync: false    # Cloudinary dashboard থেকে নিয়ে manually বসান (স্থায়ী)
      - key: DIRECTOR_USERNAME
        sync: false    # পরিচালকের লগইন আইডি — Render dashboard এ বসান
      - key: DIRECTOR_PASSWORD
        sync: false    # পরিচালকের পাসওয়ার্ড — Render dashboard এ বসান
      - key: DIRECTOR_NAME
        sync: false    # পরিচালকের নাম বাংলায়
      - key: VAPID_PRIVATE_KEY
        sync: false    # Web Push (PWA নোটিফিকেশন) — একবার তৈরি করে Render dashboard-এ বসান, স্থায়ী
# Render এর built-in database বাদ — Neon ব্যবহার করুন (কখনো expire হয় না)
