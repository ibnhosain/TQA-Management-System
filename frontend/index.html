<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo-green.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Search engine কে index করতে নিষেধ — এটা internal app -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- PWA — ফোন/আইপ্যাড/পিসিতে ইনস্টল করা যায়, নোটিফিকেশন পাঠাতে পারে।
         ডিফল্ট manifest.json (পরিচালক/এডমিন) — সব রোল বাছাই করা যায়।
         ?role=teacher / ?role=student লিংক থেকে এলে নিচের স্ক্রিপ্ট রোল-নির্দিষ্ট
         manifest-এ বদলে দেয়, তাই ওই লিংক দিয়ে ইনস্টল করলে অ্যাপ সরাসরি সেই
         রোলের লগইন ফর্মে খোলে, রোল বাছাইয়ের স্ক্রিন আসে না -->
    <link rel="manifest" href="/manifest.json" />
    <!-- আইপ্যাড/আইফোন — iOS মাপ-নির্দিষ্ট আইকন খোঁজে। শুধু একটা সাধারণ
         apple-touch-icon থাকলে আইপ্যাড অনেক সময় সেটা ব্যবহার না করে হোম
         স্ক্রিনে পাতার স্ক্রিনশট বসিয়ে দেয় — লগো দেখায় না -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <!-- পিসি/ল্যাপটপ — ডেস্কটপ ব্রাউজার ট্যাব ও ইনস্টল করা অ্যাপের উইন্ডোতে
         মাপ অনুযায়ী আইকন বাছে; মাপ ঘোষণা না থাকলে কোনোটাই বেছে নিতে না
         পেরে ফাঁকা দেখাতে পারে -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="theme-color" content="#1a5c3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TQA Academy" />
    <script>
      (function () {
        // এটা কেবল PWA ইনস্টলের সময় কোন manifest/আইকন-নাম ব্যবহার হবে তা ঠিক
        // করে — লগইন/রোল-বাছাইয়ের আসল লজিক (App-এর ভেতরে) একদমই স্পর্শ করে না
        try {
          var role = new URLSearchParams(location.search).get("role");
          if (role !== "teacher" && role !== "student") return;
          var manifestHref = role === "teacher" ? "/manifest-teacher.json" : "/manifest-student.json";
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) manifestLink.setAttribute("href", manifestHref);
          var title = role === "teacher" ? "TQA Teacher" : "TQA Student";
          document.title = title;
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute("content", title);
        } catch {
          /* উপেক্ষা */
        }
      })();
    </script>
    <!-- ফন্ট একবারই head-এ লোড হয় (আগে body-র <style>@import> এ ছিল → reflow/flash হতো) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>TQA Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
